[project]
name = "marketing-data-platform"
version = "0.1.0"
description = "Marketing data platform on the public Criteo attribution feed: daily drops, dbt star schema, observability, Prefect, Terraform for AWS and Snowflake"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.3",
    "pandas>=2.2,<3",
    "pyarrow>=15",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "prefect>=3.4,<4",
    "dbt-core>=1.10,<2",
    "dbt-duckdb>=1.9",
    "boto3>=1.34",
]

[project.optional-dependencies]
snowflake = ["dbt-snowflake>=1.10"]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mdp"]

[tool.ruff]
line-length = 100
extend-exclude = ["transform", "infra/build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S608", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
