name: marketing_platform
version: "1.0.0"
config-version: 2
profile: marketing_platform

model-paths: ["models"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: target
clean-targets: ["target", "dbt_packages"]

vars:
  # Monitoring thresholds shared with mdp/monitors.py
  max_hours_since_load: 26

models:
  marketing_platform:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

snapshots:
  marketing_platform:
    +target_schema: snapshots
